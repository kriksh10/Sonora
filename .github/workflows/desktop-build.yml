name: Sonora desktop checks and preview builds
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-build.yml
      - artifacts/sonora-ai/**
      - artifacts/api-server/src/lib/audio-chunks.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      service_url:
        description: Published HTTPS Sonora URL (not a development preview)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: mac
            arch: x64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.rust_target }}
      - name: Test native audio processing
        run: cargo test --locked --manifest-path artifacts/sonora-ai/desktop/native-audio/Cargo.toml --target ${{ matrix.rust_target }}
        env:
          CARGO_TARGET_DIR: generated-artifacts/native-target
          MACOSX_DEPLOYMENT_TARGET: "14.4"
      - name: Build native audio helper
        run: pnpm --filter @workspace/sonora-ai run desktop:build-native ${{ matrix.arch }}
      - run: pnpm --filter @workspace/sonora-ai run desktop:test
      - name: Build unsigned preview (not a verified release)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @workspace/sonora-ai run desktop:package ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          SONORA_RELEASE_URL: ${{ inputs.service_url }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Calculate checksums
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: node artifacts/sonora-ai/desktop/checksums.cjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: sonora-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            generated-artifacts/installers/*.exe
            generated-artifacts/installers/*.dmg
            generated-artifacts/installers/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
