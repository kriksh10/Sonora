name: Sonora installed Windows OS clicks
on:
  pull_request:
    branches: [replit-sync]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installed-os-clicks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-os-clicks:
    name: Installed NSIS OS clicks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build native audio helper
        run: pnpm --filter @workspace/sonora-ai run desktop:build-native x64
        env:
          CARGO_TARGET_DIR: generated-artifacts/native-target
      - name: Build the renderer
        run: pnpm --filter @workspace/sonora-ai run build
        env:
          PORT: "4173"
          BASE_PATH: /
          VITE_SONORA_E2E: "1"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_e2e
      - name: Package the NSIS installer
        run: node artifacts/sonora-ai/desktop/package-e2e.cjs
        env:
          SONORA_RELEASE_URL: https://sonora.example/
          SONORA_E2E_NSIS: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install ffmpeg
        shell: pwsh
        run: winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements
      - name: Start the mock API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path generated-artifacts | Out-Null
          $env:SONORA_MOCK_LOG = (Join-Path (Get-Location) 'generated-artifacts/mock-requests.log')
          Start-Process -FilePath node -ArgumentList "artifacts/sonora-ai/e2e/server.mjs","artifacts/sonora-ai/dist/public" -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/api/e2e/health | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 300 }
          }
          if (-not $ok) { Get-Content generated-artifacts/mock.err,generated-artifacts/mock.log -ErrorAction SilentlyContinue; throw "Mock server did not start" }
      - name: Install the NSIS build silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem generated-artifacts/installers -Filter "Sonora-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Write-Host "Installing $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -Filter "Sonora AI.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Sonora AI.exe was not installed" }
          Set-Content -Path installed-exe.txt -Value $exe.FullName
          Write-Host "Installed $($exe.FullName)"
          cmd /c "findstr 127.0.0.1 `"$($exe.DirectoryName)\resources\app.asar`" & exit /b 0"
      - name: OS-level clicks against the installed app
        shell: pwsh
        run: |
          $env:SONORA_MOCK_LOG = (Join-Path (Get-Location) 'generated-artifacts/mock-requests.log')
          $mockUp = $false
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/api/e2e/health -TimeoutSec 3 | Out-Null; $mockUp = $true } catch { $mockUp = $false }
          if (-not $mockUp) {
            Write-Host 'Restarting the mock server in this step so it is not torn down with the previous one'
            Start-Process -FilePath node -ArgumentList "artifacts/sonora-ai/e2e/server.mjs","artifacts/sonora-ai/dist/public" -WindowStyle Hidden
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/api/e2e/health -TimeoutSec 2 | Out-Null; $mockUp = $true; break } catch { Start-Sleep -Milliseconds 300 }
            }
          }
          if (-not $mockUp) { throw 'Mock server is not accepting connections' }
          $exe = Get-Content installed-exe.txt
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -STA -NoProfile -ExecutionPolicy Bypass -File artifacts/sonora-ai/e2e/os-click.ps1 -Exe $exe -OutDir generated-artifacts/os-click-proof -Full
      - name: Visual proof over a high-contrast background
        shell: pwsh
        run: |
          $mockUp = $false
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/api/e2e/health -TimeoutSec 3 | Out-Null; $mockUp = $true } catch { $mockUp = $false }
          if (-not $mockUp) {
            Start-Process -FilePath node -ArgumentList "artifacts/sonora-ai/e2e/server.mjs","artifacts/sonora-ai/dist/public" -WindowStyle Hidden
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/api/e2e/health -TimeoutSec 2 | Out-Null; $mockUp = $true; break } catch { Start-Sleep -Milliseconds 300 }
            }
          }
          if (-not $mockUp) { throw 'Mock server is not accepting connections' }
          $exe = Get-Content installed-exe.txt
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -STA -NoProfile -ExecutionPolicy Bypass -File artifacts/sonora-ai/e2e/visual-proof.ps1 -Exe $exe -OutDir generated-artifacts/visual-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-os-click-proof
          path: |
            generated-artifacts/os-click-proof/**
            generated-artifacts/visual-proof/**
            generated-artifacts/mock.log
            generated-artifacts/mock.err
            generated-artifacts/mock-requests.log
          if-no-files-found: warn
          retention-days: 14
