[package]
name = "sonora-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
serde_json = "1"
sonora = { git = "https://github.com/dignifiedquire/sonora", rev = "dec6a074725e82ef371a024fc45236d60f0acf52" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.15.3"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
ringbuf = "0.4.8"

