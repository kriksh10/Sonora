    <script>
      try {
        var savedTheme = localStorage.getItem("sonora-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.sonoraTheme = savedTheme;
          document.documentElement.style.colorScheme = savedTheme;
        }
      } catch (error) { /* theme is optional */ }
    </script>
    <script>
      // Replit injects an analytics beacon (i.replit.com/api/send) into published HTML.
      // Keep that call from hanging or rejecting in a way that can stall the page.
      (function () {
        var host = "i.replit.com";
        function isAnalytics(input) {
          try {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            return String(url).indexOf(host) !== -1;
          } catch (error) {
            return false;
          }
        }
        if (typeof window.fetch === "function") {
          var originalFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            if (!isAnalytics(input)) return originalFetch(input, init);
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var nextInit = init ? Object.assign({}, init) : {};
            if (controller && !nextInit.signal) nextInit.signal = controller.signal;
            var timer = controller ? window.setTimeout(function () { controller.abort(); }, 1500) : 0;
            return originalFetch(input, nextInit).then(function (response) {
              return response;
            }, function () {
              return new Response(null, { status: 204 });
            }).finally(function () {
              window.clearTimeout(timer);
            });
          };
        }
        if (navigator.sendBeacon) {
          var originalBeacon = navigator.sendBeacon.bind(navigator);
          navigator.sendBeacon = function (url, data) {
            try {
              if (String(url).indexOf(host) !== -1) {
                window.setTimeout(function () {
                  try { originalBeacon(url, data); } catch (error) { /* analytics must not throw */ }
                }, 0);
                return true;
              }
              return originalBeacon(url, data);
            } catch (error) {
              return false;
            }
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
