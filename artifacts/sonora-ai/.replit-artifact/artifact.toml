kind = "web"
previewPath = "/"
title = "Sonora AI"
description = "A polished AI transcription workspace for recording, uploading, and turning conversations into searchable notes and shareable summaries."
version = "1.0.0"
id = "artifacts/sonora-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25829

[services.development]
run = "pnpm --filter @workspace/sonora-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sonora-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/sonora-ai/dist/public"

# Known app routes stay on the SPA shell. Everything else falls through to
# public/404.html so the static host can return HTTP 404.
[[services.production.rewrites]]
from = "/sign-in"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-in/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/index.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/index.html"

[[services.production.rewrites]]
from = "/terms"
to = "/index.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/index.html"

[[services.production.rewrites]]
from = "/settings"
to = "/index.html"

[[services.production.rewrites]]
from = "/download"
to = "/index.html"

[[services.production.rewrites]]
from = "/desktop-connect"
to = "/index.html"

[[services.production.rewrites]]
from = "/desktop-connect/*"
to = "/index.html"

[services.env]
PORT = "25829"
BASE_PATH = "/"
