openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Private interview and regular-call sessions
paths:
  /desktop/releases:
    get:
      operationId: getDesktopRelease
      summary: Installer availability for approved accounts
      responses:
        "200":
          description: Release metadata without private storage locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopRelease"
        "401":
          description: Sign-in required
        "403":
          description: Approval required
        "503":
          description: Installer storage unavailable
  /desktop/installers/windows-x64:
    get:
      operationId: downloadWindowsInstaller
      summary: Download the Windows installer with current approval checked
      parameters:
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: A single byte range, for example bytes=0-4194303
      responses:
        "200":
          description: Windows installer attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Installer byte range; Content-Range identifies the returned bytes
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: Invalid or unsatisfiable single byte range
        "401":
          description: Sign-in required
        "403":
          description: Approval required
        "503":
          description: Installer storage unavailable
  /access/status:
    get:
      operationId: getAccessStatus
      responses:
        "200":
          description: Current user's application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
  /access/request:
    post:
      operationId: requestAppAccess
      responses:
        "200":
          description: Access request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
  /access/users:
    get:
      operationId: listAccessUsers
      responses:
        "200":
          description: Owner sees users; approver sees pending requests only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessUser"
  /access/users/{userId}:
    patch:
      operationId: changeUserAccess
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessChangeInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /files/extract:
    post:
      operationId: extractWordText
      description: Transient in-memory DOC/DOCX extraction; raw files are never saved.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedText"
  /sessions/{id}/restart:
    post:
      operationId: restartSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundStartInput"
      responses:
        "200":
          description: Next round ready; explicit audio start still required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
  /desktop-auth/requests:
    post:
      operationId: startDesktopAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopAuthStartInput"
      responses:
        "201":
          description: Code shown only in the requesting desktop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthStarted"
        default:
          $ref: "#/components/responses/SessionError"
  /desktop-auth/requests/{id}:
    parameters:
      - $ref: "#/components/parameters/DesktopRequestId"
    get:
      operationId: getDesktopAuthRequest
      responses:
        "200":
          description: State without a code or credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthState"
        default:
          $ref: "#/components/responses/SessionError"
  /desktop-auth/requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/DesktopRequestId"
    post:
      operationId: approveDesktopAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopAuthApprovalInput"
      responses:
        "200":
          description: Signed-in browser approved the desktop code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthState"
        default:
          $ref: "#/components/responses/SessionError"
  /desktop-auth/requests/{id}/poll:
    parameters:
      - $ref: "#/components/parameters/DesktopRequestId"
    post:
      operationId: pollDesktopAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopAuthProofInput"
      responses:
        "200":
          description: Pending or a single-use sign-in ticket; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthPoll"
        default:
          $ref: "#/components/responses/SessionError"
  /desktop-auth/requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/DesktopRequestId"
    post:
      operationId: cancelDesktopAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopAuthProofInput"
      responses:
        "200":
          description: Desktop request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthState"
        default:
          $ref: "#/components/responses/SessionError"
  /answer-preferences/defaults:
    get:
      operationId: getAnswerDefaults
      responses:
        "200":
          description: Current user's defaults, or standard defaults if none saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerPreferences"
    put:
      operationId: saveAnswerDefaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerPreferences"
      responses:
        "200":
          description: Saved defaults for future sessions only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerPreferences"
  /sessions/{id}/preferences:
    patch:
      operationId: updateSessionPreferences
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPreferencesInput"
      responses:
        "200":
          description: Updated owned session; applies to subsequent answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
        "404":
          description: Session not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List the signed-in user's sessions
      responses:
        "200":
          description: Sessions ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallSession"
        default:
          $ref: "#/components/responses/SessionError"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a private session with context and output settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCallSession"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
        default:
          $ref: "#/components/responses/SessionError"
  /sessions/{id}:
    delete:
      operationId: deleteSession
      responses:
        "204":
          description: Ended interview and saved history permanently deleted
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      tags: [sessions]
      summary: Reopen a private session
      responses:
        "200":
          description: Session with saved transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
        default:
          $ref: "#/components/responses/SessionError"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Start or end a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCallSessionRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
        default:
          $ref: "#/components/responses/SessionError"
  /sessions/{id}/transcript:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: appendTranscript
      tags: [sessions]
      summary: Append a recognized or typed question when transcript saving is enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendTranscriptRequest"
      responses:
        "200":
          description: Session with updated transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
        default:
          $ref: "#/components/responses/SessionError"
  /sessions/{id}/answer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateSessionAnswer
      tags: [sessions]
      summary: Generate a Gemini suggestion using the session's context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionAnswerRequest"
      responses:
        "200":
          description: Generated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAnswer"
            text/event-stream:
              schema:
                type: string
              example: 'data: {"content":"Answer text"}\n\ndata: {"done":true,"answer":"Answer text","model":"gemini-2.5-flash"}\n\n'
        default:
          $ref: "#/components/responses/SessionError"
  /sessions/{id}/transcribe:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: transcribeSessionAudio
      tags: [sessions]
      summary: Transcribe a short consented desktop audio chunk without retaining audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionAudioChunk"
      responses:
        "200":
          description: Recognized text; empty for silence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscription"
        default:
          $ref: "#/components/responses/SessionError"
components:
  parameters:
    DesktopRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SessionError:
      description: Sign-in, validation, ownership, or service error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    DesktopBuild:
      type: object
      required: [platform, architecture, label, status, url, sha256, sizeBytes, signing, minimumOs]
      properties:
        platform:
          type: string
          enum: [windows, mac]
        architecture:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [unavailable, preview, verified]
        url:
          type: [string, "null"]
        sha256:
          type: [string, "null"]
        sizeBytes:
          type: [integer, "null"]
        signing:
          type: string
        minimumOs:
          type: string
    DesktopRelease:
      type: object
      required: [version, publishedAt, builds]
      properties:
        version:
          type: string
        publishedAt:
          type: [string, "null"]
        builds:
          type: array
          items:
            $ref: "#/components/schemas/DesktopBuild"
    AccessStatus:
      type: object
      required: [status, role, email, requested]
      properties:
        status: { type: string, enum: [pending, approved, denied, revoked] }
        role: { type: string, enum: [owner, approver, user] }
        email: { type: string }
        requested: { type: boolean }
    AccessUser:
      allOf:
        - $ref: "#/components/schemas/AccessStatus"
        - type: object
          required: [userId, updatedAt]
          properties:
            userId: { type: string }
            updatedAt: { type: string, format: date-time }
    AccessChangeInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, deny, revoke] }
    ExtractedText:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 2000000 }
    RoundStartInput:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        roundNumber: { type: integer, minimum: 1 }
    InterviewRound:
      type: object
      required: [number, startedAt, endedAt]
      properties:
        number: { type: integer, minimum: 1 }
        startedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
    DesktopAuthStartInput:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge:
          type: string
          pattern: "^[a-f0-9]{64}$"
    DesktopAuthProofInput:
      type: object
      additionalProperties: false
      required: [verifier]
      properties:
        verifier:
          type: string
          pattern: "^[a-f0-9]{64}$"
    DesktopAuthApprovalInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    DesktopAuthStarted:
      type: object
      required: [id, code, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    DesktopAuthState:
      type: object
      required: [status, expiresAt]
      properties:
        status:
          type: string
          enum: [pending, approved, exchanging, consumed, cancelled]
        expiresAt:
          type: string
          format: date-time
    DesktopAuthPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, complete]
        ticket:
          type: string
    AnswerPreferences:
      type: object
      additionalProperties: false
      required: [format, length, tone, starMethod, fillerWords]
      properties:
        format:
          type: string
          enum: [full_script, script_bullets, bullet_points]
        length:
          type: string
          enum: [short, balanced, long]
        tone:
          type: string
          enum: [simple, formal]
        starMethod:
          type: boolean
        fillerWords:
          type: boolean
    SessionPreferencesInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        answerPreferences:
          $ref: "#/components/schemas/AnswerPreferences"
        instructions:
          type: string
          maxLength: 8000
        model:
          type: string
          enum: [gemini-2.5-flash, gemini-3-flash-preview]
        language:
          type: string
          enum: [English, Spanish, French, German]
        autoAnswer:
          type: boolean
        saveTranscript:
          type: boolean
    SessionAudioChunk:
      type: object
      required: [audio, mimeType]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        audio:
          type: string
          minLength: 60
          maxLength: 400000
          description: Base64 PCM WAV, mono 16 kHz, at most eight seconds
        mimeType:
          type: string
          enum: [audio/wav]
        source:
          type: string
          enum: [microphone, system]
    AudioTranscription:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 8000
    UpdateCallSessionRequest:
      type: object
      required: [status]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [ready, active, ended]
    AppendTranscriptRequest:
      type: object
      required: [text, role, source]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        text:
          type: string
          minLength: 1
          maxLength: 8000
        role:
          type: string
          enum: [user, assistant]
        source:
          type: string
          enum: [typed, microphone, system, ai]
        speaker:
          type: string
          enum: [candidate, interviewer, unknown]
        capturedAt:
          type: string
          format: date-time
    SessionAnswerRequest:
      type: object
      required: [question]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        question:
          type: string
          minLength: 1
          maxLength: 8000
        stream:
          type: boolean
        action:
          type: string
          enum: [answer, shorten, explain, again]
        previousAnswer:
          type: string
          maxLength: 24000
        test:
          type: boolean
    NewCallSession:
      type: object
      required: [sessionType]
      properties:
        sessionType:
          type: string
          enum: [interview, call]
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 8000
        resumeText:
          type: string
          maxLength: 40000
        documentsText:
          type: string
          maxLength: 40000
        instructions:
          type: string
          maxLength: 8000
        answerPreference:
          type: string
          enum: [concise, detailed, technical]
        answerPreferences:
          $ref: "#/components/schemas/AnswerPreferences"
        model:
          type: string
          enum: [gemini-2.5-flash, gemini-3-flash-preview]
        language:
          type: string
          enum: [English, Spanish, French, German]
        autoAnswer:
          type: boolean
        saveTranscript:
          type: boolean
    TranscriptEntry:
      type: object
      required: [role, text, source, createdAt]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
        source:
          type: string
          enum: [typed, microphone, system, ai]
        speaker:
          type: string
          enum: [candidate, interviewer, unknown]
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CallSession:
      type: object
      required: [id, sessionType, title, company, description, resumeText, documentsText, instructions, answerPreference, model, language, autoAnswer, saveTranscript, status, transcript, createdAt, startedAt, endedAt]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/InterviewRound"
        id:
          type: string
          format: uuid
        sessionType:
          type: string
          enum: [interview, call]
        title:
          type: string
        company:
          type: [string, "null"]
        description:
          type: [string, "null"]
        resumeText:
          type: string
        documentsText:
          type: string
        instructions:
          type: string
        answerPreference:
          type: string
        answerPreferences:
          $ref: "#/components/schemas/AnswerPreferences"
        model:
          type: string
        language:
          type: string
        autoAnswer:
          type: boolean
        saveTranscript:
          type: boolean
        status:
          type: string
          enum: [ready, active, ended]
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
    SessionAnswer:
      type: object
      required: [answer, model]
      properties:
        answer:
          type: string
        model:
          type: string
    HealthStatus:
      type: object
      properties:
        desktopAnswerProtocol:
          type: integer
          enum: [1]
        desktopAuthProtocol:
          type: integer
          enum: [1]
        desktopAudioProtocol:
          type: integer
          enum: [2]
        status:
          type: string
      required:
        - status

